# Publication automatique du site.
#
# - Chaque lundi (deux créneaux, le second ne sert que si le premier a été sauté) :
#   rédige un nouvel article avec Claude, le commite,
#   reconstruit le site et le déploie sur GitHub Pages.
# - À chaque push sur main : reconstruit et déploie seulement (pas de nouvel article).
# - Lancement manuel possible depuis l'onglet Actions (case « Rédiger un article »).

name: Publier le site

on:
  schedule:
    # GitHub retarde de plusieurs heures ou saute souvent les planifications.
    # On multiplie donc les créneaux le lundi matin (toutes les 20 minutes de 6 h 07
    # à 9 h 47 UTC) : le premier qui part rédige l'article, les suivants constatent
    # qu'un article porte déjà la date du jour et ne font rien (pas de doublon).
    - cron: "7,27,47 6-9 * * 1"
    # Dernier rattrapage en début d'après-midi.
    - cron: "41 11 * * 1"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rediger:
        description: "Rédiger un nouvel article avant de publier"
        type: boolean
        default: true
      annoncer:
        description: "Renvoyer le dernier article aux réseaux (Make) même sans nouvel article"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    outputs:
      article: ${{ steps.rediger.outputs.article }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r scripts/requirements.txt

      - name: Rédiger un nouvel article
        id: rediger
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.rediger)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_article.py

      - name: Enregistrer le nouvel article dans le dépôt
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.rediger)
        run: |
          git config user.name "robot-redaction"
          git config user.email "actions@users.noreply.github.com"
          git add content/articles topics.json
          if git diff --cached --quiet; then
            echo "Aucun nouvel article à enregistrer."
          else
            git commit -m "Nouvel article automatique du $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Construire le site
        run: python scripts/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4

  # Dès que le nouvel article est en ligne, on prévient Make, qui publie sur les réseaux.
  annoncer:
    needs: [construire, deployer]
    if: needs.construire.outputs.article != '' || (github.event_name == 'workflow_dispatch' && inputs.annoncer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r scripts/requirements.txt

      - name: Laisser le site se mettre à jour
        run: sleep 60

      - name: Prévenir Make
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: python scripts/annoncer.py "${{ needs.construire.outputs.article }}"
